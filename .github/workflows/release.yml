name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.tag.outputs.version }}
      dist-tag: ${{ steps.tag.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Check the version tag
        id: tag
        if: github.event_name == 'push'
        run: node scripts/release-tag.mjs
      - run: npm install --global pnpm@11.1.2
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm verify && pnpm test:coverage && pnpm test:ops
      - run: pnpm test:coexist
      - run: pnpm release:dry-run
      - run: node scripts/sbom.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-rehearsal
          path: |
            dist/*.tgz
            .artifacts/
          include-hidden-files: true
          if-no-files-found: error
  publish-next:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-rehearsal
          path: verified-release
      - name: Publish the exact rehearsed tarball
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_DIST_TAG: ${{ needs.verify.outputs.dist-tag }}
        run: node scripts/publish-verified.mjs verified-release
  github-release:
    needs: publish-next
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-rehearsal
          path: verified-release
      - name: Create the GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --title "$TAG" \
            --notes-file verified-release/.artifacts/release-notes.md \
            verified-release/dist/*.tgz \
            verified-release/.artifacts/release-dry-run.json \
            verified-release/.artifacts/sbom.cdx.json
