name: Watch upstream
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-watch
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
      tuple: ${{ steps.probe.outputs.tuple }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.14.0'
      - run: node scripts/probe-upstream.mjs
        id: probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: immutable-upstream-metadata
          path: .artifacts/upstream.json
          include-hidden-files: true
  compatibility:
    needs: metadata
    if: needs.metadata.outputs.changed == 'true'
    uses: ./.github/workflows/compatibility.yml
    with:
      tuple: ${{ needs.metadata.outputs.tuple }}
